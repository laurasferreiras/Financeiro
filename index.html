<style>

.bar{margin:8px 0}.bl{display:flex;justify-content:space-between;font-size:13.5px}.bl i{font-style:normal;color:var(--mut);margin-left:4px}.bt{height:7px;background:var(--soft);border-radius:4px;margin-top:4px}.bt div{height:100%;background:#C9A8F0;border-radius:4px}

.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 0}.f input,.f select{margin-top:4px;color:var(--ink);font-size:16px}.ck{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px}.ck input{width:20px;height:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}th{color:var(--ink);font-weight:600;background:var(--soft)}.n{text-align:right}
.note{color:var(--mut);font-size:13.5px;margin:8px 2px}.empty{color:var(--mut);padding:8px 2px;margin:0}
.le{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;margin:6px 0}.le input{padding:8px 10px}.le .x{border:0;background:none;color:var(--neg);font-size:22px}.auto{align-self:center;text-align:right}
.menu{display:grid;gap:8px}.menu button,.back{text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px;font:inherit}.menu b{display:block}.menu small{display:block;margin-top:2px}.back{padding:8px 12px;margin-bottom:6px;color:var(--ac);font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chart{width:100%}.chart text{fill:var(--mut);font-size:9px}.ca{fill:#9FB8F0}.cb{fill:#FFA8DC}.leg{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}.leg span{width:10px;height:10px;border-radius:3px;display:inline-block}.leg span+span{margin-left:8px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12.5px;padding:10px 0;border-radius:10px}nav button.on{color:var(--ink);font-weight:700;background:var(--lilac)}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:#FFA8DC;color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28)}

@keyframes up{from{transform:translateY(40px);opacity:.4}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.ph button{border:0;background:none;color:var(--mut);font-size:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px}.seg button{border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font:inherit;font-weight:600}.seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(80,50,120,.15)}
.primary{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#B28DF0;color:#fff;font:inherit;font-weight:700;font-size:16px}.btns .primary{width:auto;flex:1;margin:0}

</style></head><body>
<header><b id="title">Início</b><button id="syncbtn" hidden aria-label="Sincronizar com a planilha">↻</button></header>
<main id="view"></main>
<button id="fab" aria-label="Novo lançamento">+</button>
<nav><button data-nav="inicio">Início</button><button data-nav="mes">Mês</button><button data-nav="anual">Anual</button><button data-nav="hist">Histórico</button><button data-nav="mais">Mais</button></nav>
<div id="sheet" class="overlay"><div class="scrim"></div><div class="panel"><div class="ph"><b>Novo lançamento</b><button data-close aria-label="Fechar">✕</button></div><div id="sheetbody"></div></div></div>
<div id="edit" class="overlay"><div class="scrim"></div><div class="panel"><div class="ph"><b>Editar item</b><button data-close aria-label="Fechar">✕</button></div><div id="editbody"></div></div></div>
<div id="toast" role="status"></div>
<script>
/* ===== MODELO: regras e fórmulas da planilha ===== */
const CATS=['Acessórios','Roupas','Produtos cosméticos','Casa','Comida','Transporte','Outros','Estudos','Lazer','Saídas','Saúde','Investimento','Eletrônicos','Presentes'];
const TIPOS=['Débito Nubank','Débito Itaú/MP','Crédito Nubank','Crédito Itaú','Pix','Caixinha'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STATUS=['necessidade!!!','precisando','não preciso'];
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const keyOf=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
const addM=(k,n)=>{const [y,m]=k.split('-').map(Number);const t=y*12+m-1+n;return keyOf(Math.floor(t/12),t%12+1)};
const sortedKeys=S=>Object.keys(S.months).sort();

function createMonth(S,k){
  const ks=sortedKeys(S).filter(x=>x<k), p=ks.length?S.months[ks[ks.length-1]]:null;
  const dim=new Date(+k.slice(0,4),+k.slice(5),0).getDate();
  S.months[k]=p?{
    fixos:p.fixos.map(({r,c,_n,_sid,...f})=>({...f,pago:false,data:f.data?k+'-'+String(Math.min(+f.data.slice(8,10),dim)).padStart(2,'0'):f.data})),
    gastos:[],credito:[],entradas:[],texp:{...p.texp},base:null,tRest:p.tRest,uRest:p.uRest,
    pagoItau:false,pagoNu:false,wish:p.wish.filter(w=>!w.comprado).map(w=>({...w})),semRet:false
  }:{fixos:[],gastos:[],credito:[],entradas:[],texp:{},base:0,tRest:2224,uRest:2300,pagoItau:false,pagoNu:false,wish:[],semRet:false};
}
function ensureMonth(S,k){
  if(S.months[k])return;
  const ks=sortedKeys(S), last=ks[ks.length-1];
  if(last&&k>last){for(let x=addM(last,1);x<=k;x=addM(x,1))createMonth(S,x)} else createMonth(S,k);
}

function calcMonth(m,k,prevSaldo,prevInv){
  const fp=m.fixos.filter(f=>f.pago);
  const gT=t=>sum(m.gastos.filter(g=>g.tipo===t),g=>g.valor)+sum(fp.filter(f=>f.tipo===t),f=>f.valor);
  const inMonth=c=>c.data&&c.data.slice(0,7)===k;
  const q14=gT('Débito Nubank'),q15=gT('Débito Itaú/MP'),q18=gT('Pix'),q19=gT('Caixinha');
  const q16=sum(m.credito.filter(c=>c.tipo==='Crédito Nubank'&&inMonth(c)),c=>c.valor)+gT('Crédito Nubank');
  const q17=sum(m.credito.filter(c=>c.tipo==='Crédito Itaú'&&inMonth(c)),c=>c.valor)+gT('Crédito Itaú');
  const fat=(card,paga,todos)=>{const t='Crédito '+card,rows=m.credito.filter(c=>c.tipo===t),ex=gT(t);
    const total=sum(rows,c=>c.valor)+ex, aberto=sum(rows.filter(c=>!c.pago),c=>c.valor)+ex;
    const parc=paga?sum(rows.filter(c=>!c.pago&&(c.parcela||'').trim()!=='1/1'),c=>c.valor):aberto;
    return {total,aberto:paga?0:aberto,parcelas:parc,pago:!!paga,deduz:paga?(todos?total:aberto):0}};
  const nu=fat('Nubank',m.pagoNu,m.dedTodos), it=fat('Itaú',m.pagoItau,m.dedTodos);
  if(m.pagoItau&&m.itauFixo!=null)it.deduz=m.itauFixo; // fatura Itaú com valor herdado da planilha
  const entradas=sum(m.entradas,e=>e.valor), ret=sum(m.entradas.filter(e=>e.kind==='retirada'),e=>e.valor);
  const receita=m.semRet?entradas-ret:entradas, totalConta=entradas+prevSaldo;
  const disp=totalConta-q14-q15-q18-q19-nu.deduz-it.deduz;
  const saidas=q14+q15+q16+q17+q18;
  const inv=(m.base??prevInv)+sum(m.gastos.filter(g=>g.cat==='Investimento'),g=>g.valor)+sum(fp.filter(f=>f.cat==='Investimento'),f=>f.valor)-ret;
  const cats=CATS.map(c=>{const v=sum(m.gastos.filter(g=>g.cat===c),g=>g.valor)+sum(m.credito.filter(x=>x.cat===c),x=>x.valor)+sum(fp.filter(f=>f.cat===c),f=>f.valor);
    return {cat:c,esp:m.texp[c]??null,valor:v,pct:saidas?v/saidas:0}});
  const wsum=s=>sum(m.wish.filter(w=>w.status===s&&!w.comprado),w=>w.valor);
  return {entradas,receita,ret,totalConta,disp,saidas,q14,q15,q16,q17,q18,q19,nu,it,inv,cats,
    fixosPagos:sum(fp,f=>f.valor),gastosTotal:sum(m.gastos,g=>g.valor),
    tRest:m.tRest-sum(cats,c=>c.esp||0),uRest:m.uRest-sum(cats,c=>c.valor),
    wish:{nec:wsum('necessidade!!!'),prec:wsum('precisando'),nao:wsum('não preciso')}};
}
function computeAll(S){
  const out={};let saldo=S.saldoInicial,inv=0;
  for(const k of sortedKeys(S)){const c=calcMonth(S.months[k],k,saldo,inv);out[k]=c;saldo=c.disp;inv=c.inv}
  return out;
}
function monthOfFatura(date,card,S){ // 1ª fatura (mês-planilha) de uma compra no crédito
  const d=+date.slice(8,10),k=date.slice(0,7);
  return d>S.cards[card].fecha?addM(k,1):k;
}
function addCompra(S,{nome,valor,data,tipo,cat,card,n}){
  if(tipo!=='Crédito'){const k=data.slice(0,7);ensureMonth(S,k);S.months[k].gastos.push({nome,data,tipo,cat,valor,_n:true});return k}
  n=Math.max(1,Math.min(60,+n||1));const k0=monthOfFatura(data,card,S),base=Math.floor(valor/n*100)/100;
  for(let j=1;j<=n;j++){const k=addM(k0,j-1);ensureMonth(S,k);
    S.months[k].credito.push({nome,pago:false,data,tipo:'Crédito '+card,parcela:j+'/'+n,cat,valor:j===n?r2(valor-base*(n-1)):base,_n:true})}
  return k0;
}
function addEntrada(S,{desc,valor,data,kind}){const k=data.slice(0,7);ensureMonth(S,k);S.months[k].entradas.push({desc,valor,kind,_n:true});return k}
function seedInstallments(S,from){
  const m=S.months[from];if(!m)return;
  for(const r of m.credito){const mt=/^(\d+)\/(\d+)$/.exec((r.parcela||'').trim());if(!mt)continue;
    for(let j=+mt[1]+1;j<=+mt[2];j++){const k=addM(from,j-+mt[1]);ensureMonth(S,k);const t=S.months[k];
      if(!t.credito.some(c=>c.nome===r.nome&&c.parcela===j+'/'+mt[2]&&c.data===r.data))t.credito.push({...r,pago:false,parcela:j+'/'+mt[2],_n:true})}}
}
function initState(D){
  const S={months:JSON.parse(JSON.stringify(D.months)),saldoInicial:D.saldoInicial,
    cards:{Nubank:{fecha:25,vence:2},'Itaú':{fecha:24,vence:1}},calc:JSON.parse(JSON.stringify(D.calc)),meta:JSON.parse(JSON.stringify(D.meta)),
    hist:D.hist||{},reports:D.reports||{}};
  S.calc.limite=D.calc.limite??2400;S.calc.refMes=null;
  if(S.months['2026-10']){seedInstallments(S,'2026-10');ensureMonth(S,'2026-12')}return S;
}
function annual(S,C,year){
  const ks=[...Array(12)].map((_,i)=>keyOf(year,i+1)),has=ks.filter(k=>S.months[k]);
  const rec=ks.map(k=>C[k]?C[k].receita:0),des=ks.map(k=>C[k]?C[k].saidas:0);
  const R=sum(rec,x=>x),Dd=sum(des,x=>x),last=has.length?C[has[has.length-1]].inv:0;
  const matrix=CATS.map(c=>{const row=ks.map(k=>C[k]?C[k].cats.find(x=>x.cat===c).valor:0);return {cat:c,row,total:sum(row,x=>x)}});
  const colTot=ks.map((_,i)=>sum(matrix,r=>r.row[i]));
  return {ks,rec,des,R,D:Dd,invest:last,saldo:R-Dd+last,media:Dd/12,taxa:R?(R-Dd)/R:0,matrix,colTot,totalGeral:sum(colTot,x=>x),
    semInv:sum(matrix,r=>r.total)-matrix.find(r=>r.cat==='Investimento').total};
}

const DATA={"months":{},"saldoInicial":0,"hist":{},"reports":{},"meta":{"meta":0,"meses":[]},"calc":{"salario":0,"limite":0,"proximos":[],"fixos":[],"variaveis":[],"ops":{"soma":[],"sub":[{"n":"saldo","v":0}]}}};
/* ===== SINCRONIZAÇÃO COM A PLANILHA (Google Sheets) ===== */
const SYNC_KEY='financeiro_sync',OPS_KEY='financeiro_ops';
let SY={};try{SY=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')}catch(e){}
let OPS=[];try{OPS=JSON.parse(localStorage.getItem(OPS_KEY)||'[]')}catch(e){}
let syncing=false,syncAgain=false,syncTimer,lastTry=0;
const FIELDS={fixos:['nome','pago','data','tipo','cat','valor'],gastos:['nome','data','tipo','cat','valor'],credito:['nome','pago','data','tipo','parcela','cat','valor'],wish:['nome','valor','status','comprado']};
const pick=(o,k)=>Object.fromEntries(FIELDS[k].map(f=>[f,o[f]]));
const saveSY=()=>localStorage.setItem(SYNC_KEY,JSON.stringify(SY));
const saveOps=()=>localStorage.setItem(OPS_KEY,JSON.stringify(OPS));
const syncOn=()=>!!(SY.url&&SY.key);
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function qop(o){if(!syncOn())return;o.id=rid();OPS.push(o);saveOps();schedSync(1200)}
function schedSync(ms){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),ms||1200)}
function pendCount(){let n=OPS.length;for(const m of Object.values(S.months))for(const s of['fixos','gastos','credito','wish','entradas'])n+=(m[s]||[]).filter(x=>x._n).length;return n}
function syncBtn(state){const b=document.querySelector('#syncbtn');if(!b)return;b.hidden=!syncOn();b.className=state||'';b.title=state==='err'?(SY.erro||'Erro'):'Sincronizar com a planilha'}
function softRender(){
  const op=[...document.querySelectorAll('#view details')].map(d=>d.open),y=scrollY;render();
  document.querySelectorAll('#view details').forEach((d,i)=>{if(op[i]!==undefined)d.open=op[i]});scrollTo(0,y);
}
async function syncNow(manual){
  if(!syncOn())return;
  if(syncing){syncAgain=true;return}
  if(!manual&&document.querySelector('.overlay.on')){schedSync(5000);return}
  syncing=true;lastTry=Date.now();syncBtn('spin');
  try{
    const batch=OPS.slice(),adds=[];
    for(const [k,m] of Object.entries(S.months)){
      for(const sec of['fixos','gastos','credito','wish'])(m[sec]||[]).forEach(it=>{if(it._n){it._sid=rid();adds.push({id:it._sid,op:'put',month:k,sec,item:pick(it,sec)})}});
      (m.entradas||[]).forEach(it=>{if(it._n){it._sid=rid();adds.push({id:it._sid,op:'ent',month:k,kind:it.kind,valor:it.valor})}});
    }
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
    const resp=await fetch(SY.url,{method:'POST',body:JSON.stringify({key:SY.key,ops:[...batch,...adds]}),headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal});
    clearTimeout(to);const j=await resp.json();
    if(!j.ok)throw new Error(j.erro||'Erro na planilha');
    const okIds=new Set(j.res.filter(x=>x.ok).map(x=>x.id));
    const falhas=j.res.filter(x=>!x.ok&&x.erro!=='aba').length;
    OPS=OPS.filter(o=>!batch.includes(o));saveOps();
    const before=JSON.stringify(S.months);
    const keep=a=>(a||[]).filter(it=>it._n&&!(it._sid&&okIds.has(it._sid)));
    for(const [k,r] of Object.entries(j.months)){
      const old=S.months[k],prevK=sortedKeys(S).filter(x=>x<k).pop(),fl=old||(prevK?S.months[prevK]:{});
      S.months[k]={fixos:r.fixos.concat(keep(old&&old.fixos)),gastos:r.gastos.concat(keep(old&&old.gastos)),credito:r.credito.concat(keep(old&&old.credito)),
        wish:r.wish.concat(keep(old&&old.wish)),entradas:r.entradas.concat(keep(old&&old.entradas)),
        texp:{...(old?old.texp:{}),...r.texp},base:r.base??(old?old.base:null)??null,tRest:r.tRest??(old?old.tRest:2224),uRest:r.uRest??(old?old.uRest:2300),
        pagoItau:r.pagoItau,pagoNu:r.pagoNu,semRet:!!fl.semRet,dedTodos:fl.dedTodos,itauFixo:old?old.itauFixo??null:null};
    }
    SY.last=Date.now();SY.erro=falhas?falhas+' alteração(ões) não coube(ram) na planilha':'';saveSY();
    recalc();save();
    if(JSON.stringify(S.months)!==before){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName)))softRender()}
    else if(route.page==='mais')softRender();
    if(manual)toast(falhas?SY.erro:'Planilha sincronizada');
    syncBtn(SY.erro?'err':'');
  }catch(e){
    SY.erro=e.name==='AbortError'?'Tempo esgotado':(e.message==='Failed to fetch'?'Sem conexão':e.message);saveSY();syncBtn('err');if(manual)toast(SY.erro);
  }finally{syncing=false;if(syncAgain){syncAgain=false;schedSync(800)}}
}

function pgMeta(){
  const m=S.meta,tot=sum(m.meses,x=>x.valor),rest=m.meta-tot;
  return `<button class="back" data-go="">‹ Mais</button><h2>Meta</h2><div class="card"><label class="f">Meta${inp('meta.meta','number','num')}</label>${bars([['Guardado',tot]],Math.max(m.meta,1))}
  <div class="kv"><span class="t">Valor restante</span><b class="t">${fmt(rest)}</b></div>${rest<=0?'<p class="note">Meta batida!!</p>':''}</div><h2>Mês a mês</h2><div class="card">${listEd('meta.meses','mes','valor')}<div class="kv"><span class="t">Total</span><b class="t">${fmt(tot)}</b></div></div>`;
}
function pgCfg(){
  return `<button class="back" data-go="">‹ Mais</button><h2>Cartões</h2><div class="card"><p class="note">O dia de fechamento define em qual fatura entra a 1ª parcela de uma compra.</p>
  ${['Nubank','Itaú'].map(c=>`<div class="kv"><span class="t">${c}</span><b></b><span>Fecha dia</span><b>${inp(`cards.${c}.fecha`,'number','num')}</b><span>Vence dia</span><b>${inp(`cards.${c}.vence`,'number','num')}</b></div>`).join('')}</div>
  <h2>Backup</h2><div class="card"><p class="note">Os dados ficam salvos neste aparelho. Exporte de vez em quando para guardar uma cópia ou passar para outro celular.</p><div class="btns"><button class="pill" id="exp">Exportar dados</button><button class="pill" id="imp">Importar dados</button><button class="pill warn" id="rst">Apagar todos os dados</button></div><input type="file" id="file" accept="application/json" hidden></div>`;
}

/* ---------- formulário de lançamento ---------- */
let fm={tab:'compra'};
function openForm(){
  fm={tab:'compra'};$('#sheet').classList.add('on');drawForm();
}
function drawForm(){
  const t=fm.tab,d=today();
  $('#sheetbody').innerHTML=`<div class="seg"><button class="${t==='compra'?'on':''}" data-ftab="compra">Compra</button><button class="${t==='entrada'?'on':''}" data-ftab="entrada">Entrada</button></div>
  ${t==='compra'?`<label class="f">Descrição<input id="f_nome" placeholder="Ex.: tênis"></label>
  <div class="two"><label class="f">Valor total<input id="f_valor" inputmode="decimal" placeholder="0,00"></label><label class="f">Data<input id="f_data" type="date" value="${d}"></label></div>
  <label class="f">Categoria<select id="f_cat">${opts(CATS,'Comida')}</select></label>
  <label class="f">Forma de pagamento<select id="f_tipo"><option>Crédito</option><option>Débito Nubank</option><option>Débito Itaú/MP</option><option>Pix</option><option>Caixinha</option></select></label>
  <div id="f_cred"><div class="two"><label class="f">Cartão<select id="f_card"><option>Nubank</option><option>Itaú</option></select></label><label class="f">Parcelas<input id="f_n" type="number" min="1" max="60" value="1" inputmode="numeric"></label></div><p class="note" id="f_prev"></p></div>`
  :`<label class="f">Tipo<select id="f_kind"><option value="salario">Salário</option><option value="pix">Pix recebido</option><option value="retirada">Retirada da caixinha</option></select></label>
  <div class="two"><label class="f">Valor<input id="f_valor" inputmode="decimal" placeholder="0,00"></label><label class="f">Data<input id="f_data" type="date" value="${d}"></label></div>`}
  <button class="primary" id="f_ok">${t==='compra'?'Adicionar compra':'Adicionar entrada'}</button>`;
  prevParc();
}
const num=s=>parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
const numF=s=>{s=String(s).trim();return s.includes(',')?num(s):parseFloat(s)||0};
function prevParc(){
  const p=$('#f_prev');if(!p)return;const tipo=$('#f_tipo').value;$('#f_cred').style.display=tipo==='Crédito'?'':'none';
  const v=numF($('#f_valor').value),n=Math.max(1,+$('#f_n').value||1),card=$('#f_card').value,data=$('#f_data').value;
  if(!v||!data){p.textContent='';return}
  const k=monthOfFatura(data,card,S);p.textContent=`${n}x de ${fmt(v/n)} · 1ª parcela na fatura de ${mshort(k)} (vence ${String(S.cards[card].vence).padStart(2,'0')}/${addM(k,1).slice(5)})`;
}
function submitForm(){
  const v=numF($('#f_valor').value),data=$('#f_data').value;
  if(!v||v<=0||!data){toast('Informe valor e data');return}
  let k;
  if(fm.tab==='compra'){
    const nome=$('#f_nome').value.trim();if(!nome){toast('Informe a descrição');return}
    const tp=$('#f_tipo').value;k=addCompra(S,{nome,valor:v,data,tipo:tp,cat:$('#f_cat').value,card:$('#f_card').value,n:$('#f_n').value});
    toast(tp==='Crédito'?`Compra parcelada em ${Math.max(1,+$('#f_n').value||1)}x`:'Compra adicionada');
  }else{
    const kind=$('#f_kind').value;k=addEntrada(S,{desc:{salario:'Salário',pix:'Pix Recebidos',retirada:'Retirada'}[kind],valor:v,data,kind});toast('Entrada adicionada');
  }
  mesSel=data.slice(0,7);$('#sheet').classList.remove('on');commit();
}

/* ---------- edição de itens ---------- */
const SCHEMA={
  fixos:[['nome','Nome'],['pago','Pago?','bool'],['data','Data','date'],['tipo','Tipo','sel',TIPOS],['cat','Categoria','sel',CATS],['valor','Valor','num']],
  gastos:[['nome','Nome'],['data','Data','date'],['tipo','Tipo','sel',TIPOS],['cat','Categoria','sel',CATS],['valor','Valor','num']],
  credito:[['nome','Nome'],['pago','Pago?','bool'],['data','Data da compra','date'],['tipo','Cartão','sel',['Crédito Nubank','Crédito Itaú']],['parcela','Parcela (ex.: 2/6)'],['cat','Categoria','sel',CATS],['valor','Valor da parcela','num']],
  entradas:[['desc','Descrição'],['kind','Tipo','sel2',[['salario','Salário'],['pix','Pix recebido'],['retirada','Retirada da caixinha']]],['valor','Valor','num']],
  wish:[['nome','Nome'],['status','Prioridade','sel',STATUS],['valor','Valor','num'],['comprado','Já comprei','bool']]
};
const NEW={fixos:{nome:'',pago:false,data:today(),tipo:'Pix',cat:'Casa',valor:0},entradas:{desc:'Pix Recebidos',kind:'pix',valor:0},wish:{nome:'',status:'precisando',valor:0,comprado:false}};
let ed=null;
function openEd(kind,i){
  const m=S.months[mesSel],isNew=i==null;
  ed={kind,i,obj:isNew?{...NEW[kind]}:{...m[kind][i]}};
  const f=SCHEMA[kind];
  $('#editbody').innerHTML=f.map(([k,l,t,o])=>{const v=ed.obj[k];
    if(t==='bool')return `<label class="f ck"><input type="checkbox" data-ef="${k}" ${v?'checked':''}> ${l}</label>`;
    if(t==='sel')return `<label class="f">${l}<select data-ef="${k}">${opts(o,v)}</select></label>`;
    if(t==='sel2')return `<label class="f">${l}<select data-ef="${k}">${o.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${x[1]}</option>`).join('')}</select></label>`;
    return `<label class="f">${l}<input data-ef="${k}" data-ty="${t||'text'}" ${t==='date'?'type="date"':t==='num'?'inputmode="decimal"':''} value="${esc(v)}"></label>`}).join('')
   +`<div class="btns"><button class="primary" id="e_ok">Salvar</button>${isNew?'':'<button class="pill warn" id="e_del">Excluir</button>'}</div>`;
  $('#edit').classList.add('on');
}
function saveEd(){
  document.querySelectorAll('[data-ef]').forEach(e=>{const k=e.dataset.ef;ed.obj[k]=e.type==='checkbox'?e.checked:e.dataset.ty==='num'?numF(e.value):e.value});
  const L=S.months[mesSel][ed.kind],prev=ed.i==null?null:L[ed.i];
  if(!prev)ed.obj._n=true;
  else if(prev.r&&!prev._n)qop({op:'put',month:mesSel,sec:ed.kind,row:prev.r,item:pick(ed.obj,ed.kind)});
  else if(ed.kind==='entradas'&&prev.c&&!prev._n){
    if(ed.obj.kind===prev.kind)qop({op:'cell',month:mesSel,a1:prev.c,value:ed.obj.valor});
    else{qop({op:'cell',month:mesSel,a1:prev.c,value:''});delete ed.obj.c;ed.obj._n=true}
  }
  prev?L[ed.i]=ed.obj:L.push(ed.obj);
  $('#edit').classList.remove('on');commit();
}

/* ---------- render e eventos ---------- */
function render(){
  const p=route.page;kn=0;
  $('#view').innerHTML=p==='inicio'?pgInicio():p==='mes'?pgMes():p==='anual'?pgAnual():p==='hist'?pgHist():pgMais();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===p));
  $('#title').textContent={inicio:'Início',mes:'Mês',anual:'Relatório anual',hist:'Histórico',mais:'Mais'}[p];
  if(window.__keep){window.__keep();window.__keep=null}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,.row,.scrim');if(!t)return;const d=t.dataset;
  if(t.id==='syncbtn')return syncNow(true);
  if(d.nav)return go(d.nav);
  if(d.go!==undefined)return go('mais',d.go||null);
  if(d.mnav){const ks=sortedKeys(S),i=ks.indexOf(mesSel)+ +d.mnav;if(ks[i]){mesSel=ks[i];render()}else if(+d.mnav>0){mesSel=addM(mesSel,1);ensureMonth(S,mesSel);commit()}return}
  if(d.toggle){e.stopPropagation();const [k,i]=d.toggle.split(':'),o=S.months[mesSel][k][i];if(k==='wish')o.comprado=!o.comprado;else o.pago=!o.pago;if(o.r&&!o._n)qop({op:'put',month:mesSel,sec:k,row:o.r,item:k==='wish'?{comprado:o.comprado}:{pago:o.pago}});return commit()}
  if(d.fatura){const [k,c]=d.fatura.split(':'),m=S.months[k],f=c==='Nubank'?'pagoNu':'pagoItau';m[f]=!m[f];qop({op:'cell',month:k,a1:c==='Nubank'?'C48':'C47',value:m[f]});return commit()}
  if(d.edit){const [k,i]=d.edit.split(':');return openEd(k,+i)}
  if(d.new)return openEd(d.new,null);
  if(d.ftab){fm.tab=d.ftab;return drawForm()}
  if(d.del){const [p,i]=d.del.split(':');getp(S,p).splice(+i,1);return commit()}
  if(d.addl){const L=getp(S,d.addl);const f=L[0]||(d.addl==='meta.meses'?{mes:'',valor:0}:d.addl.startsWith('calc.ops')?{n:'',v:0}:{nome:'',valor:0});L.push(Object.fromEntries(Object.keys(f).filter(k=>k!=='auto').map(k=>[k,typeof f[k]==='number'?0:''])));return commit()}
  switch(t.id){
    case'fab':return openForm();
    case'sy_save':{SY.url=$('#sy_url').value.trim();SY.key=$('#sy_key').value.trim();saveSY();syncBtn();return syncNow(true)}
    case'sy_now':return syncNow(true);
    case'sy_off':SY={};saveSY();OPS=[];saveOps();syncBtn();return render();
    case'f_ok':return submitForm();
    case'e_ok':return saveEd();
    case'e_del':{const it=S.months[mesSel][ed.kind][ed.i];if(it&&!it._n){if(it.r)qop({op:'del',month:mesSel,sec:ed.kind,row:it.r});else if(it.c)qop({op:'cell',month:mesSel,a1:it.c,value:''})}}S.months[mesSel][ed.kind].splice(ed.i,1);$('#edit').classList.remove('on');return commit();
    case'exp':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='financeiro-backup-'+today()+'.json';a.click();return}
    case'imp':return $('#file').click();
    case'rst':if(confirm('Apagar TODOS os dados deste aparelho? (exporte um backup antes se quiser guardá-los)')){localStorage.removeItem(LS);OPS=[];saveOps();S=initState(DATA);ensureMonth(S,today().slice(0,7));commit();toast('Dados apagados')}return;
  }
  if(t.classList.contains('scrim')||d.close!==undefined){$('#sheet').classList.remove('on');$('#edit').classList.remove('on')}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.id==='msel'){mesSel=t.value;return render()}
  if(t.id==='asel'){anoSel=+t.value;return render()}
  if(t.id==='hano'){histSel={ano:t.value,item:null};return render()}
  if(t.id==='hitem'){histSel.item=t.value;return render()}
  if(t.id==='refmes'){S.calc.refMes=t.value;return commit()}
  if(t.id==='file'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o.months)throw 0;S=o;S.hist=S.hist||{};S.reports=S.reports||{};mesSel=today().slice(0,7);ensureMonth(S,mesSel);commit();toast('Dados importados')}catch(_){toast('Arquivo inválido')}});return}
  if(d.inv!==undefined){const m=S.months[mesSel],pv=C[addM(mesSel,-1)],eff=m.base??(pv?pv.inv:0);m.base=r2(eff+numF(t.value)-C[mesSel].inv);qop({op:'base',month:mesSel,value:m.base});return commit()}
  if(d.esp!==undefined){const v=t.value.trim();S.months[mesSel].texp[d.esp]=v===''?null:numF(v);qop({op:'texp',month:mesSel,cat:d.esp,value:S.months[mesSel].texp[d.esp]});return commit()}
  if(d.bind){const v=d.t==='number'?numF(t.value):t.value;setp(S,d.bind,v);return commit()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(['f_valor','f_data','f_tipo','f_card','f_n'].includes(t.id))prevParc();
  if(t.dataset.calc){const a=numF($('#ca').value),b=numF($('#cb').value);$('#cm').textContent=a*b?a*b:(a===0||b===0?'0':'-');$('#cd').textContent=b?(a/b).toLocaleString('pt-BR',{maximumFractionDigits:4}):'-'}
});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
load();render();syncBtn();if(syncOn())schedSync(400);

</script></body></html>
